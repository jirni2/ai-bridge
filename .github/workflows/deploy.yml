# AI Bridge: тести + публікація на Cloudflare Pages (проєкт aibridge-aff).
#   гілка main    -> основний сайт  https://aibridge-aff.pages.dev
#   будь-яка інша -> пробне посилання https://<гілка>.aibridge-aff.pages.dev
# Потрібні секрети репозиторію: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Tests and deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # bash -eo pipefail: помилка wrangler не ховається за tee

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Full regression suite
        run: node tools/run-all-tests.mjs
      - name: ESLint gate
        run: npx eslint -c tools/eslint.config.mjs core.js app.js crew.js _worker.js
        continue-on-error: true   # 4 відомі зауваження про BridgeCore; не блокує

  deploy:
    name: Deploy to Cloudflare Pages
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Prepare site folder
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' \
                --exclude='.wrangler' --exclude='releases' --exclude='CLAUDE.md' \
                ./ "$RUNNER_TEMP/site/"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Немає секрету CLOUDFLARE_API_TOKEN або CLOUDFLARE_ACCOUNT_ID у Settings → Secrets and variables → Actions"
            exit 1
          fi
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/site" \
            --project-name=aibridge-aff \
            --branch="$BRANCH" \
            --commit-hash="$SHA" \
            --commit-message="deploy ${SHA:0:7} from $BRANCH" \
            --commit-dirty=true | tee "$RUNNER_TEMP/deploy.log"
      - name: Summary
        if: always()
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "Основний сайт: https://aibridge-aff.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Пробне посилання для гілки \`$BRANCH\`:" >> "$GITHUB_STEP_SUMMARY"
          fi
          grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/deploy.log" | sort -u >> "$GITHUB_STEP_SUMMARY" || true
